name: Publish to npm

# Publishes @mindot/will to npm via TRUSTED PUBLISHING (OIDC) — no stored token.
#
# Trigger: publish a GitHub Release (the human gate) — or run manually via
# "Run workflow" for a re-run.
#
# The version that ships is package.json's `version`. Bump it + create a Release
# to publish a new version; the workflow no-ops if that version is already on npm.
#
# Auth: NONE stored. npm authenticates this run through GitHub's OIDC identity
# (id-token: write) against the trusted publisher configured on the package —
#   npmjs.com → @mindot/will → Settings → Trusted Publisher
#   = GitHub Actions · mindot-ai/will · workflow publish.yml
# Provenance attestations are generated automatically (no --provenance flag), so
# the npm page shows the verified "built and published from mindot-ai/will" badge.
#
# Requires npm >= 11.5.1 (trusted-publishing support) — Node 24 ships npm 11.16.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing + automatic provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # IMPORTANT: intentionally NO `registry-url`/`scope`. setup-node's
      # `registry-url` writes an .npmrc with
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and sets NODE_AUTH_TOKEN to a placeholder — npm then sees a (garbage)
      # token, uses token auth, and SKIPS the OIDC trusted-publishing exchange,
      # failing with E404. With no token configured, npm (>= 11.5.1; node 24
      # ships 11.16) performs the OIDC exchange itself. npm defaults to
      # registry.npmjs.org, and package.json's publishConfig handles scope+access.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # ── TEMPORARY OIDC DIAGNOSTIC (remove once publishing is green) ──
      # Prints the identity GitHub asserts (decoded public claims only — never
      # the signed token) so we can compare it field-by-field to the trusted
      # publisher config on npmjs.com. Also flags if id-token:write isn't
      # actually granting a token (GitHub/org-side OIDC restriction).
      - name: Inspect OIDC claims (temporary diagnostic)
        run: |
          echo "node $(node --version) / npm $(npm --version)"
          echo "GITHUB_REPOSITORY:   $GITHUB_REPOSITORY"
          echo "GITHUB_WORKFLOW_REF: $GITHUB_WORKFLOW_REF"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::ACTIONS_ID_TOKEN_REQUEST_URL is EMPTY — id-token:write is NOT effective (GitHub/org-side OIDC not granted). npm can never do the exchange."
            exit 0
          fi
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          export RESP
          node -e '
            const r = JSON.parse(process.env.RESP || "{}");
            if (!r.value) { console.log("NO OIDC token returned:", JSON.stringify(r)); process.exit(0); }
            const p = JSON.parse(Buffer.from(r.value.split(".")[1], "base64url").toString());
            const { sub, aud, repository, repository_owner, job_workflow_ref, workflow_ref, ref, environment, event_name } = p;
            console.log("OIDC claims npm will present to the registry:");
            console.log(JSON.stringify({ sub, aud, repository, repository_owner, job_workflow_ref, workflow_ref, ref, environment, event_name }, null, 2));
          '

      - name: Skip if this version is already published
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@mindot/will@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@mindot/will@${VERSION} is already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # `npm publish` runs prepublishOnly (typecheck + tests + fresh build) — a
      # stale or broken dist can never ship. Trusted publishing attaches
      # provenance automatically; --access public mirrors package.json.
      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: |
          set -o pipefail
          npm publish --access public --loglevel silly 2>&1 | tee /tmp/pub.log || true
          echo "═════ OIDC / auth-relevant lines ═════"
          grep -iE "oidc|trusted|exchange|audience|id.?token|authoriz|need auth|ENEEDAUTH|40[0-9]|unauthor|forbidden|provenance" /tmp/pub.log || echo "(none matched)"
          # Fail the step unless the publish actually succeeded.
          grep -q "^+ @mindot/will@" /tmp/pub.log

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            echo "### ⏭️ @mindot/will@${{ steps.check.outputs.version }} already published — no-op" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Published @mindot/will@${{ steps.check.outputs.version }} (trusted publishing · OIDC)" >> "$GITHUB_STEP_SUMMARY"
            echo "https://www.npmjs.com/package/@mindot/will/v/${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
