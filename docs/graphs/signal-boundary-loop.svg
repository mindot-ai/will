<text x="40" y="56" font-size="25" font-weight="700" fill="#f8fafc" letter-spacing="0.2">The signal boundary — the mind knows its own doing from the world’s</text>
<text x="40" y="80" font-size="13" fill="#8b93a7">Everything that reaches a mind arrives through one door and must SAY whose doing it was; everything that leaves goes out through one crossing and comes back as facts the mind perceives, not a verdict it is handed. Provenance is asserted at the edge, never inferred later — because by then only the mind can tell, and it is the one thing it cannot work out alone</text>
