name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # The record is generated, so it cannot drift from what the documents say:
      # a new .TODO doc without a Standing line, or a stale INDEX.md, fails here.
      - name: Development record
        run: |
          bun .TODO/index.ts
          git diff --exit-code -- .TODO/INDEX.md \
            || { echo '::error::INDEX.md is stale — run `bun .TODO/index.ts` and commit it'; exit 1; }

      # The record must not point at what is not there. Dead file paths and dead
      # type/function names in comments, prose and the README, against a checked-in
      # baseline of the ones that predate the check — so only NEW ones fail, and
      # the baseline can only shrink. See the header of .TODO/references.ts.
      - name: Record references
        run: bun .TODO/references.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # All development happens in the open — every push gets the same scan the
      # original publish script ran. Scans full history + working tree.
      - name: Scan for secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact -v
